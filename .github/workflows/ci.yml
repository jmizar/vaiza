name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unit tests, database rules
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility scan, screenshots
        run: npm run e2e
      - name: Upload screenshots and a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.sha }}
          path: |
            e2e/screens
            e2e/a11y-report.json
            playwright-report
          retention-days: 14
